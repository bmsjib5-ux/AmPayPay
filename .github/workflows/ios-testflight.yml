name: iOS → TestFlight

# กดรันเองจากแท็บ Actions (หรือแก้เป็น push: branches: [main] ถ้าอยากให้ส่งบิลด์ทุกครั้งที่ merge)
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'เลขเวอร์ชันที่ผู้ใช้เห็น เช่น 1.0.0'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.ampaypay.app' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: ตรวจว่าใส่ Secrets ครบแล้ว
        run: |
          missing=""
          [ -n "$TEAM_ID" ]   || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ]    || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "${{ secrets.APPSTORE_PRIVATE_KEY }}" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::ยังไม่ได้ตั้งค่า Secrets เหล่านี้ใน Settings → Secrets and variables → Actions:$missing"
            echo "วิธีสร้างคีย์อยู่ใน ios/README.md"
            exit 1
          fi

      - name: วางคีย์ App Store Connect (.p8)
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${KEY_ID}.p8
          cp ~/private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: ติดตั้ง XcodeGen แล้วสร้างไฟล์โปรเจกต์
        run: |
          brew install xcodegen
          cd ios && xcodegen generate --spec project.yml

      - name: Archive (ให้ Xcode ออกใบรับรอง/โปรไฟล์ให้อัตโนมัติ)
        run: |
          cd ios
          xcodebuild archive \
            -project AmPayPay.xcodeproj \
            -scheme AmPayPay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AmPayPay.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${{ github.event.inputs.marketing_version || '1.0.0' }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export เป็นไฟล์ .ipa
        run: |
          sed "s/__TEAM_ID__/${TEAM_ID}/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AmPayPay.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -lh "$RUNNER_TEMP/export"

      - name: ตรวจไฟล์ก่อนอัป
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: อัปขึ้น TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "อัปเสร็จแล้ว — รอ App Store Connect ประมวลผลราว 5–15 นาที แล้วบิลด์จะขึ้นใน TestFlight"

      - name: เก็บไฟล์ .ipa ไว้ดาวน์โหลด (เผื่ออัปไม่ผ่าน)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmPayPay-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14
