# Render Blueprint — เว็บสแตติกล้วน ไม่ต้อง build
# ใช้ได้ทั้งแบบ Blueprint (New + > Blueprint) และ New + > Static Site
services:
  - type: web
    name: ampaypay-expense-book
    runtime: static
    buildCommand: "echo 'static site — no build step'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # ห้ามแคชยาว ไม่งั้นมือถือจะค้างอยู่กับโค้ดเก่าหลัง deploy
      - path: /*
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # กล้องใช้สแกน QR และถ่ายใบเสร็จ (เฉพาะโดเมนนี้) นอกนั้นปิดทั้งหมด
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      # CSP: จำกัดว่าโค้ด/การเชื่อมต่อมาจากที่ไหนได้บ้าง ลดผลกระทบถ้ามีช่องโหว่ XSS
      # Tesseract.js ต้องใช้ Web Worker (blob:) + wasm และดึงชุดภาษาจาก tessdata จึงต้องอนุญาตไว้
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; manifest-src 'self'; connect-src 'self' data: blob: https://*.supabase.co https://cdn.jsdelivr.net https://tessdata.projectnaptha.com"
